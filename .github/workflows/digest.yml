name: Daily goal digest

# Fired by cron-job.org at 10:00, 12:00, 15:00 and 18:00 Arizona, a few minutes
# after the hourly export lands so the numbers are the ones on the board. No
# `schedule:` block — GitHub's scheduler lags badly at peak, sometimes by the
# better part of an hour, which is the whole reason the export moved off it.
#
# The board decides whether a run should actually send: /api/digest returns
# skip:true at the weekend, and the job exits quietly.
on:
  workflow_dispatch:
    inputs:
      to:
        description: "Test send to these addresses instead — comma, semicolon or space separated. Subject gets [TEST]"
        type: string
        required: false
      dry_run:
        description: "Render only — write digest_preview.html and send nothing"
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      TZ: America/Phoenix
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      REPORT_KEY: ${{ secrets.REPORT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # Inputs go in through the environment rather than being interpolated into
      # the command. Interpolating put the typed addresses straight into a shell
      # line, so "a@x.com, b@y.com" split on the space and failed the job — and
      # anything else typed in that box would have been shell too.
      - name: Send digest
        env:
          DIGEST_TO: ${{ inputs.to }}
          DIGEST_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS="--digest"
          if [ "$DIGEST_DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$DIGEST_TO" ]; then ARGS="$ARGS --force"; fi
          python meridian_report_bot.py $ARGS
      - name: Upload preview
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-preview
          path: digest_preview.html
